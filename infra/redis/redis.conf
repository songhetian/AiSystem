bind 0.0.0.0
protected-mode no
port 6379
daemonize no

# Keep pid and logs in the mounted data directory for easier troubleshooting.
pidfile /var/run/redis.pid
logfile /data/redis.log

# Snapshot persistence configuration.
dbfilename dump.rdb
dir /data
save 900 1
save 300 10
save 60 10000

# Enable AOF to reduce the risk of data loss after container restarts.
appendonly yes
appendfsync everysec

# Conservative memory guardrail for the default local environment.
maxmemory 512mb
maxmemory-policy allkeys-lru
