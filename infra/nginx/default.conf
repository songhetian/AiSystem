# ============================================================================
# 雷犀 AI 客服系统 - Nginx 反向代理配置
# ============================================================================
# 说明：
# 1. 监听端口：80（HTTP），生产环境建议配置 HTTPS（443）
# 2. 路由规则：
#    - /api/*  -> 后端服务（backend-service:3000）
#    - /*      -> 前端服务（frontend-service:8000）
# 3. 服务名称：
#    - backend-service：后端容器名称（在 docker-compose.yml 中定义）
#    - frontend-service：前端容器名称（在 docker-compose.yml 中定义）
# 4. 代理配置：
#    - 保留真实 IP 地址
#    - 支持 WebSocket 连接
#    - 设置合理的超时时间
# ============================================================================

server {
  # 监听端口：80（HTTP）
  listen 80;

  # 服务器名称：localhost（开发环境）
  # 生产环境：修改为实际域名，如 www.example.com
  server_name localhost;

  # 客户端请求体最大大小：50MB
  # 用于文件上传，与后端 MAX_FILE_SIZE 保持一致
  client_max_body_size 50M;

  # ============================================================================
  # 后端 API 路由
  # ============================================================================
  # 说明：所有 /api/* 请求转发到后端服务
  # 示例：http://localhost/api/auth/login -> http://backend-service:3000/auth/login
  # ============================================================================
  location /api/ {
    # 代理目标：后端服务（去掉 /api 前缀）
    proxy_pass http://backend-service:3000/;

    # 保留原始请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持（用于实时通信）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ============================================================================
  # 前端页面路由
  # ============================================================================
  # 说明：所有其他请求转发到前端服务
  # 示例：http://localhost/ -> http://frontend-service:8000/
  # ============================================================================
  location / {
    # 代理目标：前端服务
    proxy_pass http://frontend-service:8000/;

    # 保留原始请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持（用于热更新）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ============================================================================
  # 静态资源缓存配置（可选）
  # ============================================================================
  # 说明：对静态资源（图片、CSS、JS）设置缓存，提高访问速度
  # ============================================================================
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend-service:8000;
    proxy_set_header Host $host;

    # 缓存时间：7天
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # ============================================================================
  # 健康检查端点（可选）
  # ============================================================================
  # 说明：用于负载均衡器或监控系统检查服务状态
  # ============================================================================
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

