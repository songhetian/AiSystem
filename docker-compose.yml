services:
  # ---------------------------------------------------------
  # [NEW] Mock Service - 外部平台仿真沙盒 (V21.0)
  # ---------------------------------------------------------
  mock-service:
    build:
      context: ./dev-tools
      dockerfile: Dockerfile
    container_name: leixin-mock-server
    ports:
      - "3888:3888"
    volumes:
      - ./dev-tools/data-templates:/app/data-templates
    networks:
      - aisystem-network
    restart: always

  # ---------------------------------------------------------
  # MySQL - 核心数据存储
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: mysql-service
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/conf:/etc/mysql/conf.d
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  redis:
    image: redis:7.2.4
    container_name: redis-service
    restart: always
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  minio:
    image: minio/minio:RELEASE.2024-05-01T00-08-08Z
    container_name: minio-service
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - backend-network

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: qdrant-service
    restart: always
    command: --api-key ${QDRANT_API_KEY}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend-network

  nginx:
    image: nginx:1.25.3
    container_name: nginx-service
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-service
    restart: always
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./backend/prisma:/app/prisma # 挂载 Prisma 文件夹以便于数据库迁移同步
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    networks:
      - backend-network

  # [NEW] 管理端离线工具执行环境 (可选启动)
  # 职责：用于执行 dev-tools 中的种子数据注入与环境检查
  seeder:
    image: node:20-alpine
    container_name: seeder-tool
    profiles: ["tools"] # 仅在执行特定指令时拉起
    volumes:
      - .:/app
    working_dir: /app/dev-tools
    environment:
      - NODE_ENV=development
    entrypoint: ["sh", "-c", "npm install && npm run seed"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  qdrant-data:

networks:
  backend-network:
    driver: bridge
