services:
  # ---------------------------------------------------------
  # Mock Service - 电商平台 API 模拟服务
  # 说明：模拟京东、拼多多、淘宝的真实接口，仅开发环境使用
  # 端口：从环境变量 MOCK_SERVICE_PORT 读取，默认 3888
  # 接口：
  #   - 京东：/api/jd/*
  #   - 拼多多：/api/pdd/*
  #   - 淘宝：/api/taobao/*
  # 启动条件：仅当 NODE_ENV=development 时启动
  # ---------------------------------------------------------
  mock-service:
    build:
      context: ./dev-tools
      dockerfile: Dockerfile
    container_name: leixin-mock-server
    ports:
      - "${MOCK_SERVICE_PORT:-3888}:3888"
    volumes:
      - ./dev-tools:/app
      - ./dev-tools/data-templates:/app/data-templates
    working_dir: /app
    command: npm run start
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - backend-network
    restart: always
    profiles:
      - dev # 使用 dev profile，需要显式启动

  # ---------------------------------------------------------
  # MySQL - 核心数据存储
  # 说明：MySQL 8.0.36，使用 utf8mb4 字符集
  # 端口：从环境变量 MYSQL_PORT 读取，默认 3306
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: mysql-service
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/conf:/etc/mysql/conf.d
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  # ---------------------------------------------------------
  # Redis - 缓存服务
  # 说明：Redis 7.2.4，用于缓存、会话存储、限流等
  # 端口：从环境变量 REDIS_PORT 读取，默认 6379
  # ---------------------------------------------------------
  redis:
    image: redis:7.2.4
    container_name: redis-service
    restart: always
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  # ---------------------------------------------------------
  # MinIO - 对象存储服务
  # 说明：MinIO 对象存储，用于文件上传、图片存储等
  # API 端口：从环境变量 MINIO_API_PORT 读取，默认 9000
  # 控制台端口：从环境变量 MINIO_CONSOLE_PORT 读取，默认 9001
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: minio-service
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - backend-network

  # ---------------------------------------------------------
  # Qdrant - 向量数据库
  # 说明：Qdrant 向量数据库，用于 AI 知识库、语义搜索等
  # HTTP 端口：从环境变量 QDRANT_PORT 读取，默认 6333
  # gRPC 端口：从环境变量 QDRANT_GRPC_PORT 读取，默认 6334
  # ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: qdrant-service
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend-network

  # ---------------------------------------------------------
  # Nginx - 反向代理服务器
  # 说明：Nginx 反向代理，统一入口，路由到前后端服务
  # 端口：从环境变量 NGINX_PORT 读取，默认 80
  # 配置：/api/* 路由到后端，/* 路由到前端
  # 开发环境：可选启动（使用 --profile prod 启动）
  # 生产环境：必须启动
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.25.3
    container_name: nginx-service
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend-network
    profiles:
      - prod  # 添加 profile，开发环境不启动

  # ---------------------------------------------------------
  # Backend - 后端服务
  # 说明：NestJS 后端服务，提供 RESTful API
  # 端口：从环境变量 PORT 读取，默认 3000
  # 依赖：MySQL、Redis、MinIO
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-service
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/src:/app/src
      - ./backend/storage:/app/storage
      - ./backend/tsconfig.json:/app/tsconfig.json
    networks:
      - backend-network

  # ---------------------------------------------------------
  # Frontend - 前端服务
  # 说明：Umi/React 前端服务
  # 端口：从环境变量 FRONTEND_PORT 读取，默认 8000
  # 开发环境：8000（本地开发调试）
  # 生产环境：8000（通过 Nginx 代理访问）
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aisystem-frontend-v8:latest
    container_name: frontend-service
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - PORT=${FRONTEND_PORT:-8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8000}:${FRONTEND_PORT:-8000}"
    networks:
      - backend-network

  # ---------------------------------------------------------
  # Seeder - 数据库种子数据工具（可选启动）
  # 说明：用于执行 dev-tools 中的种子数据注入与环境检查
  # 使用方式：docker compose --profile tools up seeder
  # ---------------------------------------------------------
  seeder:
    image: node:20-alpine
    container_name: seeder-tool
    profiles: ["tools"]
    volumes:
      - .:/app
    working_dir: /app/dev-tools
    environment:
      - NODE_ENV=development
    entrypoint: ["sh", "-c", "npm install && npm run seed"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network

# ============================================================================
# 数据卷配置 (Volumes)
# ============================================================================
# 说明：持久化存储，数据不会因容器重启而丢失
# ============================================================================

# ============================================================================
# 数据卷配置 (Volumes)
# ============================================================================
# 说明：持久化存储，数据不会因容器重启而丢失
# ============================================================================
volumes:
  mysql-data: # MySQL 数据存储
  redis-data: # Redis 数据存储
  minio-data: # MinIO 对象存储
  qdrant-data: # Qdrant 向量数据库存储

# ============================================================================
# 网络配置 (Networks)
# ============================================================================
# 说明：所有服务使用同一个 backend-network 网络，可以通过服务名互相访问
# 例如：backend 可以通过 mysql-service:3306 访问 MySQL
# ============================================================================
networks:
  backend-network:
    driver: bridge
